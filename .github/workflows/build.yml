name: Magpie OpenCode plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compatibility:
        description: Run real OpenCode tests with disposable profiles and mock upstreams
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opencode-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-proxy-plugin-${{ runner.os }}
          path: '*.tgz'
          if-no-files-found: error

  compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install a disposable OpenCode test runtime
        run: |
          npm install --prefix bridge-runtime --no-audit --no-fund opencode-ai@1.18.35 @opencode-ai/plugin@1.18.35
          node -e 'const fs=require("fs"),path=require("path");const root=path.resolve("bridge-runtime/node_modules/opencode-ai"),pkg=require(path.join(root,"package.json"));const bin=path.resolve(root,typeof pkg.bin==="string"?pkg.bin:pkg.bin.opencode);fs.appendFileSync(process.env.GITHUB_ENV,"TEST_OPENCODE_COMMAND="+JSON.stringify([bin])+"\nTEST_OPENCODE_PLUGIN_DIR="+path.resolve("bridge-runtime/node_modules/@opencode-ai/plugin")+"\n")'
      - run: npm run test:integration
      - name: Verify the Magpie plugin host with disposable authentication
        run: |
          curl -fL https://raw.githubusercontent.com/yetone/magpie/18c3976234b322e68a52cf092b1ea4ebffc23b38/internal/plugin/host.js -o bridge-runtime/magpie-host.js
          node -e 'const fs=require("fs"),path=require("path");fs.appendFileSync(process.env.GITHUB_ENV,"TEST_MAGPIE_HOST="+path.resolve("bridge-runtime/magpie-host.js")+"\n")'
      - run: npm run test:magpie-host
