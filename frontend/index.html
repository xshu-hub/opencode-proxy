<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="admin-token" content="__ADMIN_TOKEN__" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenCode Proxy</title>
    <script src="theme.js"></script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到内容</a>
    <aside class="sidebar" aria-label="应用导航">
      <a class="brand" href="?view=models"
        ><span class="brand-mark" aria-hidden="true">O<span>↗</span></span
        ><span
          ><strong>OpenCode Proxy</strong
          ><small>模型连接，简单一点</small></span
        ></a
      >
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-note">
        <span class="status-dot"></span><span>通过全局 OpenCode 推理</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          <span>工作空间</span><span class="crumb-sep">/</span
          ><strong id="page-label">模型</strong>
        </div>
        <div class="top-actions">
          <span id="gateway-status" class="badge muted">正在连接</span
          ><button
            id="theme-toggle"
            class="icon-button"
            aria-label="切换外观"
            title="切换外观"
          ></button
          ><button
            id="refresh"
            class="icon-button"
            aria-label="刷新"
            title="刷新"
          ></button>
        </div>
      </header>
      <main id="content" tabindex="-1">
        <div class="loading-state">正在连接本地服务…</div>
      </main>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
